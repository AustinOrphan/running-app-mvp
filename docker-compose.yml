services:
  app:
    build: .
    ports:
      - '3001:3001'
    volumes:
      - app-data:/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # The server derives "today" and the current week from its own clock, so the container
      # needs the runner's timezone. TZ is an OS setting, not an application variable.
      TZ: ${TZ:-UTC}
    restart: unless-stopped

volumes:
  app-data:
