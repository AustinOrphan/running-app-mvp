name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Six jobs: five that run side by side, so that a run lasts as long as the longest of them and not
# as long as their sum, and `ci`, which waits for them. `npm run check` (`check:static`, then every
# Vitest project) is what a developer runs before a commit; `static`, `unit` and `sweeps` run its
# parts, so a part that `check` gains has to reach one of them: `check:static` and the `!sweep`
# project filter of `test:unit` do that on their own, and a new Vitest project is in `unit` unless it
# is named `sweep`.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A high or critical advisory on a runtime dependency fails the build here, so it shows as a red
      # check instead of waiting for a Dependabot PR that nobody opens. Dev dependencies are left out:
      # the Docker image installs without them.
      - run: npm audit --omit=dev --audit-level=high
      # Lint, Prettier, typecheck and the offline research check.
      - run: npm run check:static

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A red shard does not hide what the other one finds.
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every Vitest project except `sweep` (server and API, engine and shared code, web), two
      # shards by file.
      - run: npm run test:unit -- --shard=${{ matrix.shard }}

  sweeps:
    runs-on: ubuntu-latest
    # Above the 15 minutes of the sweep project's test timeout, so that Vitest times a hung test out
    # and names it before the job is killed.
    timeout-minutes: 20
    strategy:
      # A red shard does not hide what the other one finds.
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The long engine files (the `sweep` project, `tests/vitestProjects.ts`), two shards by file.
      - run: npm run test:sweep -- --shard=${{ matrix.shard }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's Playwright image carries chromium and the system packages it needs, so the job
    # installs nothing from the Ubuntu archive: on 2026-11-11 the runners could not reach any Ubuntu
    # mirror for hours (24.04 and 26.04 alike) and `playwright install-deps` failed every run. Earlier
    # a runner twice hung on the browser download until the 20 minutes ran out. The tag must equal the
    # installed Playwright; the first step below fails with both versions when a bump leaves it behind.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the image matches the installed Playwright
        run: |
          installed="$(node -p "require('playwright/package.json').version")"
          test "$installed" = "1.64.1" || { echo "Playwright $installed is installed but the e2e image is v1.64.1: update container.image in ci.yml"; exit 1; }
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # The image must still build after a change to dependencies, the Dockerfile, a migration or
  # `web/sw/buildSw.ts`; its last stage runs `prisma migrate deploy` as a smoke test. No path filter:
  # a filtered job leaves the required `ci` check unreported on other PRs. Nothing is pushed and no
  # registry is logged in to; layers are cached in the GitHub Actions cache. The Dockerfile pulls only
  # from Docker Hub and the npm registry (no apt), so the Ubuntu mirror outage of 2026-11-11 does not
  # reach it.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check that branch protection and the merge rule read, named `ci` as the single job was.
  # A job that needs a failed job is skipped, and a skipped required check reads as passed, so this
  # one runs after a failure too (not after a cancel) and fails itself unless all five succeeded.
  ci:
    needs: [static, unit, sweeps, e2e, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          SWEEPS: ${{ needs.sweeps.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "static=$STATIC unit=$UNIT sweeps=$SWEEPS e2e=$E2E docker=$DOCKER"
          for result in "$STATIC" "$UNIT" "$SWEEPS" "$E2E" "$DOCKER"; do
            if [ "$result" != success ]; then
              echo "A job did not succeed."
              exit 1
            fi
          done
